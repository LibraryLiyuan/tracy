<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tracy 本地报告查看器</title><link rel="icon" href="favicon.svg">
<style>html,body{height:100%;margin:0;background:#222;color:#eee;font:14px system-ui}body{display:flex;flex-direction:column}header{height:54px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:6px 12px;background:#243447;flex-shrink:0}#title{font-weight:600}#status{font-size:12px;color:#d5dfed}#caption{flex:1;min-width:0}button,a{color:inherit}button{background:#385875;border:1px solid #7390a8;border-radius:4px;padding:6px 9px;cursor:pointer}button:disabled{opacity:.4}#viewport{flex:1;min-height:0;overflow:hidden}canvas{display:block;border:0;outline:0}#error{display:none;background:#731f23;padding:14px;white-space:pre-wrap}small{font-size:11px;color:#c5d4e1}</style></head>
<body><header><div id="caption"><div id="title">Tracy 原生 Profiler</div><div id="status">正在初始化…</div></div><small>滚轮缩放 · 右键拖动时间与轨道 · 左键查看事件</small><button id="reset" disabled>回到报告位置</button><button id="details" disabled>事件详情</button></header><div id="error" role="alert"></div><div id="viewport"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas></div><script src="report-viewer.js"></script><script async src="tracy-profiler.js"></script></body></html>
